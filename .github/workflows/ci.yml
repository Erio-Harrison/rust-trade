name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://trading:trading@localhost:5432/trading_core
  REDIS_URL: redis://127.0.0.1:6379

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # sqlx's query! macro validates every query against a live Postgres at
        # compile time, so the schema has to be loaded before `cargo check`.
        # The webkit2gtk/appindicator/etc. packages are Tauri v2's documented
        # Linux build prerequisites (src-tauri is part of this workspace).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-client \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev

      - name: Load database schema
        run: |
          PGPASSWORD=trading psql -h localhost -U trading -d trading_core -f config/schema.sql
          PGPASSWORD=trading psql -h localhost -U trading -d trading_core -f config/live_strategy_log.sql

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
